<!doctype html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MoreFunOS Design Center V0.1</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC",sans-serif;color:#18191d;background:#f4f5f8}.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}header{height:56px;background:#fff;border-bottom:1px solid #e5e6eb;display:flex;align-items:center;padding:0 16px;gap:12px}header b span{font-weight:500;color:#747780}.badge{font-size:12px;padding:5px 9px;background:#eeecff;color:#5948d8;border-radius:7px}.grow{flex:1}button{border:0;background:#f3f3f6;border-radius:8px;padding:8px 10px;cursor:pointer}button.primary{background:#5d4ee5;color:#fff}main{display:grid;grid-template-columns:220px 1fr 270px;min-height:0;flex:1}.panel{background:#fff;padding:12px;overflow:auto}.left{border-right:1px solid #e5e6eb}.right{border-left:1px solid #e5e6eb}.title{font-size:11px;font-weight:700;color:#858892;margin:6px 4px 10px}.layer{display:grid;grid-template-columns:1fr auto;gap:5px;margin-bottom:4px}.layer>button:first-child{text-align:left;background:transparent}.layer.active>button:first-child{background:#eeecff;color:#5545d7}.workspace{display:flex;flex-direction:column;min-width:0}.toolbar{height:46px;background:#fff;border-bottom:1px solid #e5e6eb;display:flex;align-items:center;gap:6px;padding:0 10px}.stage{flex:1;overflow:auto;display:grid;place-items:center;padding:24px;background-image:radial-gradient(#d5d7df 1px,transparent 1px);background-size:20px 20px}.frame{position:relative;background:white;box-shadow:0 10px 40px #2222;overflow:hidden;transform-origin:center}.node{position:absolute;padding:5px;overflow:hidden}.node.sel{outline:2px solid #6252e8;outline-offset:1px}.shape{background:#eceafc}.status{height:28px;background:#fff;border-top:1px solid #e5e6eb;font-size:10px;color:#858892;padding:7px 10px;display:flex;justify-content:space-between}label{display:block;font-size:11px;color:#737680;margin:10px 0}input,select{width:100%;margin-top:4px;padding:8px;border:1px solid #dfe0e5;border-radius:7px;background:#fafafa}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.tokens button,.versions button{width:100%;text-align:left;margin:3px 0}.mobilebar,.sheet{display:none}.ok{color:#198754}.err{color:#c03535}@media(max-width:767px){header{height:52px}header b span,.badge,.desktopOnly{display:none}main{display:block}.left,.right{display:none}.workspace{height:calc(100dvh - 112px)}.toolbar{height:42px}.stage{padding:12px}.frame{max-width:100%;border-radius:18px}.status{display:none}.mobilebar{height:60px;background:#fff;border-top:1px solid #e5e6eb;display:grid;grid-template-columns:repeat(5,1fr)}.mobilebar button{border-radius:0;background:#fff;font-size:11px}.sheet{position:fixed;inset:0;background:#1115;z-index:20;align-items:flex-end}.sheet.open{display:flex}.sheet>div{width:100%;max-height:72vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:16px}.frame{transform:scale(.3)}} </style></head><body><div id="app"></div><script>const KEY='morefunos-dc-v01';const now=()=>new Date().toISOString();const contract={moduleId:'p-line.shell',version:'0.1.0',mission:'提供P-Line UI軀幹',slots:['header','main','footer','overlay'],capabilities:['render','adaptive-layout'],inputs:['runtimeViewModel'],events:['ui.intent'],commands:['ui.select'],states:['default','disabled','error'],acceptance:['desktop','mobile','no-business-truth']};const seed=()=>({id:'p-line-ui-v01',name:'P-Line UI Candidate',schemaVersion:'1.0',targetProfile:'p-line',nodes:[{id:'root',type:'frame',name:'P-Line 1280×800',x:0,y:0,width:1280,height:800,visible:true,locked:true,fill:'#fff'},{id:'title',type:'text',name:'標題',x:48,y:48,width:420,height:56,visible:true,locked:false,text:'P-Line 工作台',fill:'#111827'}],tokens:[{id:'surface',name:'Surface',value:'#ffffff'},{id:'ink',name:'Ink',value:'#111827'},{id:'accent',name:'Accent',value:'#6d5dfc'}],components:[{id:'component-title',name:'P-Line 標題',rootNodeId:'title'}],modules:[contract],contracts:[contract],runtimeManifest:{productLineId:'p-line',runtimeVersion:'0.1.0',modules:['p-line.shell@0.1.0'],permissions:[],workflow:['runtime-intent-only'],adapters:['canonical-store-readonly'],theme:'default',compatibility:'design-center-v0.1'},versions:[],updatedAt:now()});let doc;try{doc=JSON.parse(localStorage.getItem(KEY))||seed()}catch{doc=seed()}let selected='title',profile='desktop',sheet='';const save=()=>{doc.updatedAt=now();localStorage.setItem(KEY,JSON.stringify(doc));render()};const add=(type)=>{const id='n-'+Date.now();doc.nodes.push({id,type,name:type==='text'?'新文字':'新卡片',x:80,y:150,width:type==='text'?240:280,height:type==='text'?48:140,visible:true,locked:false,text:type==='text'?'新文字':undefined,fill:type==='text'?'#111827':'#eceafc'});selected=id;render()};const patch=(k,v)=>{const n=doc.nodes.find(x=>x.id===selected);if(n&&!n.locked){n[k]=['x','y','width','height'].includes(k)?+v:v;doc.updatedAt=now();render()}};const layer=(act,id)=>{const i=doc.nodes.findIndex(n=>n.id===id);if(i<1)return;if(act==='vis')doc.nodes[i].visible=!doc.nodes[i].visible;if(act==='lock')doc.nodes[i].locked=!doc.nodes[i].locked;if(act==='up'&&i>1)[doc.nodes[i-1],doc.nodes[i]]=[doc.nodes[i],doc.nodes[i-1]];if(act==='down'&&i<doc.nodes.length-1)[doc.nodes[i+1],doc.nodes[i]]=[doc.nodes[i],doc.nodes[i+1]];render()};const checkpoint=()=>{const snap=JSON.stringify({...doc,versions:[]});doc.versions.push({id:'v-'+Date.now(),label:'里程碑 '+(doc.versions.length+1),at:now(),snapshot:snap});save()};const rollback=id=>{const v=doc.versions.find(x=>x.id===id);if(!v)return;const keep=[...doc.versions,{id:'v-'+Date.now()+'-pre',label:'回復前備份',at:now(),snapshot:JSON.stringify({...doc,versions:[]})}];doc=JSON.parse(v.snapshot);doc.versions=keep;save()};const validate=()=>{const s=JSON.stringify(doc.runtimeManifest).toLowerCase(),bad=['firebase-direct','printer','cashdrawer','nativebridge','business-truth','payment-authority','order-truth'].filter(x=>s.includes(x));return bad};const exportIt=()=>{const e=validate();if(e.length)return alert('禁止輸出：'+e.join(','));const b=new Blob([JSON.stringify({document:doc,manifest:doc.runtimeManifest,contracts:doc.contracts,exportedAt:now()},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=doc.id+'-candidate.json';a.click();URL.revokeObjectURL(u)};const inspector=()=>{const n=doc.nodes.find(x=>x.id===selected);if(!n)return'<p>請選擇元素</p>';return`<div class=title>屬性</div><label>名稱<input value="${n.name}" onchange="patch('name',this.value)"></label>${n.type==='text'?`<label>文字<input value="${n.text||''}" onchange="patch('text',this.value)"></label>`:''}<div class=grid>${['x','y','width','height'].map(k=>`<label>${k}<input type=number value="${n[k]}" onchange="patch('${k}',this.value)"></label>`).join('')}</div><label>顏色<input type=color value="${n.fill||'#111827'}" onchange="patch('fill',this.value)"></label><p>${n.locked?'🔒 已鎖定':'可編輯'}</p>`};const layers=()=>doc.nodes.map(n=>`<div class="layer ${selected===n.id?'active':''}"><button onclick="selected='${n.id}';render()">${n.visible?'◉':'○'} ${n.name}</button>${n.id==='root'?'':`<span><button onclick="layer('vis','${n.id}')">眼</button><button onclick="layer('lock','${n.id}')">鎖</button><button onclick="layer('up','${n.id}')">↑</button><button onclick="layer('down','${n.id}')">↓</button></span>`}</div>`).join('');function render(){const scale=profile==='desktop'?.75:.3,fw=1280*scale,fh=800*scale;document.getElementById('app').innerHTML=`<div class=app><header><b>MoreFunOS <span>Design Center</span></b><span class=badge>P-Line · V0.1</span><span class=grow></span><button class=desktopOnly onclick="profile='desktop';render()">電腦</button><button class=desktopOnly onclick="profile='mobile';render()">手機</button><button onclick=save()>儲存</button><button class=primary onclick=exportIt()>輸出</button></header><main><aside class="panel left"><div class=title>圖層</div>${layers()}<div class=title>模組</div>${doc.modules.map(m=>`<button>${m.moduleId}<br><small>${m.mission}</small></button>`).join('')}</aside><section class=workspace><div class=toolbar><button onclick="add('text')">＋文字</button><button onclick="add('shape')">＋卡片</button><button onclick=checkpoint()>建立版本</button><span class=grow></span><b>${profile==='desktop'?'1280×800':'手機預覽'}</b></div><div class=stage><div class=frame style="width:${fw}px;height:${fh}px">${doc.nodes.filter(n=>n.id!=='root'&&n.visible).map(n=>`<div onclick="selected='${n.id}';render()" class="node ${n.type==='shape'?'shape':''} ${selected===n.id?'sel':''}" style="left:${n.x*scale}px;top:${n.y*scale}px;width:${n.width*scale}px;height:${n.height*scale}px;color:${n.type==='text'?n.fill:'#111'};background:${n.type==='shape'?n.fill:'transparent'};font-size:${28*scale}px">${n.text||n.name}</div>`).join('')}</div></div><div class=status><span>${doc.id} · ${doc.runtimeManifest.productLineId}</span><span class="${validate().length?'err':'ok'}">${validate().length?'Boundary FAIL':'Boundary PASS'}</span></div></section><aside class="panel right">${inspector()}<div class=title>設計 Token</div><div class=tokens>${doc.tokens.map(t=>`<button>${t.name} · ${t.value}</button>`).join('')}</div><div class=title>版本</div><div class=versions>${doc.versions.slice().reverse().map(v=>`<button onclick="rollback('${v.id}')">↩ ${v.label}</button>`).join('')||'<small>未建立版本</small>'}</div><div class=title>Runtime</div><small>${doc.runtimeManifest.modules.join(', ')}<br>${doc.runtimeManifest.compatibility}</small></aside></main><nav class=mobilebar><button onclick="sheet='layers';render()">圖層</button><button onclick="add('text')">新增</button><button onclick="sheet='inspect';render()">屬性</button><button onclick=save()>儲存</button><button onclick=exportIt()>輸出</button></nav><div class="sheet ${sheet?'open':''}" onclick="sheet='';render()"><div onclick="event.stopPropagation()">${sheet==='layers'?'<div class=title>圖層</div>'+layers():inspector()}<button onclick="sheet='';render()">完成</button></div></div></div>`}render();</script></body></html>
