name: Build MoreFun SMT V0.4.2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - build/smt-v0.4.2-real
    paths:
      - 'android/smt-v042/**'
      - '.github/workflows/build-smt-v042.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Make Gradle executable
        working-directory: android/smt-v042
        run: chmod +x gradlew

      - name: Verify project
        working-directory: android/smt-v042
        run: |
          java -version
          ./gradlew --version
          ./verification/run_all.sh

      - name: Build debug APK
        working-directory: android/smt-v042
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Validate APK
        run: |
          APK=$(find android/smt-v042/app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -f "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          sha256sum "$APK" | tee MoreFun_SMT_V0.4.2_SHA256.txt
          cp "$APK" MoreFun_SMT_V0.4.2_DEBUG.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoreFun-SMT-V0.4.2-Debug-APK
          path: |
            MoreFun_SMT_V0.4.2_DEBUG.apk
            MoreFun_SMT_V0.4.2_SHA256.txt
          if-no-files-found: error
          retention-days: 14
